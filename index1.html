<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Business Unit 1 – Study Hub</title>
<style>
:root{--bg:#f4f8fb;--card:#fff;--ink:#1d2b3a;--mut:#5b6f82;--pri:#1e5075;--acc:#2a8fad;--ok:#1f8c70;--bad:#b5524a;--line:#d8e4ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1b26;--card:#182735;--ink:#e6eef5;--mut:#9ab0c2;--pri:#6cb6d6;--acc:#4fb3d1;--line:#2a3d4d}}
:root[data-theme=dark]{--bg:#0f1b26;--card:#182735;--ink:#e6eef5;--mut:#9ab0c2;--pri:#6cb6d6;--acc:#4fb3d1;--line:#2a3d4d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center;padding:8px 10px;overflow-x:auto}
header b{color:var(--pri);margin-right:6px;white-space:nowrap}
nav button{border:0;background:none;color:var(--mut);padding:8px 12px;border-radius:999px;font:600 14px inherit;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--pri);color:var(--bg)}nav{display:flex;gap:4px}
main{max-width:760px;margin:0 auto;padding:14px 14px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
h2{margin:6px 0 10px;font-size:20px}h3{margin:0 0 6px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.tile b{display:block;color:var(--pri);font-size:16px}.tile span{color:var(--mut);font-size:13px}
.btn{border:0;background:var(--pri);color:var(--bg);padding:10px 16px;border-radius:10px;font:600 14px inherit;cursor:pointer;margin:4px 4px 4px 0}
.btn.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 11px;border-radius:999px;font:13px inherit;cursor:pointer}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.flash{min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:21px;font-weight:600;cursor:pointer;padding:20px;border-radius:16px;background:var(--card);border:2px solid var(--acc)}
.flash.back{font-size:17px;font-weight:500;background:var(--pri);color:var(--bg);border-color:var(--pri)}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.ok{background:var(--ok);color:#fff}.opt.bad{background:var(--bad);color:#fff}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.mut{color:var(--mut);font-size:13px}.ans{background:var(--bg);border-left:4px solid var(--ok);padding:10px 12px;border-radius:8px;margin-top:8px}
.ans p{margin:4px 0}textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:10px;font:inherit}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:10px 12px}summary{font-weight:700;cursor:pointer;color:var(--pri)}
li{margin:4px 0}.q{white-space:pre-line}
</style></head><body>
<header><b>📘 Business · Unit 1</b><nav id="nav"></nav></header><main id="app"></main>
<script>
const D={"q": [{"n": 1, "t": "p", "m": 6, "q": "Five years ago, Manisha started making cakes from her home. The cakes are for celebrations, such as weddings and birthdays. Now she has a small shop and 3 employees. Product quality is important to her. Manisha said, “the demand is growing so fast, I wasn't expecting this, it is increasing by 500% each year.” The business is profitable at last, but I have to work every day.’ A friend has offered to become Manisha’s business partner.\nIdentify and explain two advantages for Manisha taking a partner (6)", "a": "**Advantage 1 – shared workload:** a partner can run the shop on some days, so Manisha gets days off and less stress.|**Advantage 2 – shared capital:** demand is growing 500% a year, so a partner's money can buy more equipment/bigger premises to meet demand and keep quality.|(Also: shared skills/ideas = better decisions.)|**Disadvantage:** unlimited liability – she may have to use personal wealth to pay debts; disagreements slow decisions; profits are shared."}, {"n": 2, "t": "p", "m": 8, "q": "Zumito is a business partnership between two brothers Richie and Justin. It provides bus tours for people wanting to go on holiday. The demand is growing. After two successful years, Justin wants to expand the business by buying more buses. One of the busses they want to buy is expensive, They cannot decide whether to rent it or buy it.\nWhat is meant by a ‘business partnership’? (2)\nIdentify and explain one advantage and one disadvantage of Zumito being in a business partnership (6) Advantage:", "a": "**Definition:** a business owned and controlled by 2 or more people who share capital, profits and responsibility (often with a partnership agreement).|**Advantage:** shared capital – can afford the expensive bus; so expansion and higher sales/profit.|**Disadvantage:** unlimited liability – if the loan/purchase fails the brothers may lose personal wealth; OR disagreements (rent vs buy) waste time."}, {"n": 3, "t": "p", "m": 8, "q": "Sarah set up a business as a sole trader running a nursery for small children too young to go to school. The business is successful and has opened several new nurseries. Sarah took on a business partner in 2024. Growth has continued and now the business has 10 nurseries in different towns and villages. Sarah is planning to open another nursery and is looking for a suitable location.\nWhat is meant by the term ‘sole trader’? (2)\nIdentify and explain two advantages to Sarah of having a business partner. (6)", "a": "**Sole trader:** a business owned and controlled by one person.|**Advantage 1 – shared capital:** more money to open a new nursery, so faster growth.|**Advantage 2 – shared workload/skills:** with 10 nurseries a partner shares management and location decisions, giving better decisions and less stress.|(Also: shared risk, more ideas.)"}, {"n": 4, "t": "l", "m": 6, "q": "GG is a public limited company. It has 10 toys shops around the country X. Demand is increasing and they want to open a new shop. The directors are looking for a suitable location. The market has many large competitors and GG wants to prepare to overcome the competition. It is thinking of making new range of toys.\nWhat is meant by “public limited company” (2)\nIdentify and explain one advantage and one disadvantage of GG being a public limited company. (4)", "a": "**PLC:** a company owned by shareholders, run by a board of directors, whose shares can be sold to the public on the stock exchange.|**Advantage:** can raise large amounts of capital by selling shares – to open the new shop and develop a new toy range.|**Disadvantage:** risk of takeover/loss of control (50%+ shares) – competitors could buy the company; OR expensive and complicated to sell shares / accounts must be published."}, {"n": 5, "t": "l", "m": 4, "q": "DSY is a private limited company. It produces washing machines. The Director wants DSY to expand into a different market. He plans to invest money to develop electric cars. There is a lot of competition in the electric car market. This market is growing rapidly. The Director knows that important decisions about the method of production and the new car’s brand image still have to be made\nOutline two advantages to DSY of being a private limited company. (4)", "a": "**Limited liability:** the director only risks the money invested, so investing in electric cars is less risky.|**Separate legal identity/continuity:** the company continues if owners change.|**Raise capital:** by selling shares privately, to fund car development.|**Keeps control:** shares only sold to chosen people, easier to keep control than a plc."}, {"n": 6, "t": "f", "m": 8, "q": "After 20 years working for a bank, Luis has savings of $5000. He wants to start up his own business selling and repairing mobile (cell) phones. It is a competitive market. Luis has decided not to buy a franchise for $4500 as he thinks it is better to operate the business independently rather than be a franchisee. Based on his market research, he will need 15 customers each week to cover his costs.\nWhat is meant by Franchisee (2)\nIdentify and explain two disadvantages for of not becoming a franchisee (6)", "a": "**Franchisee:** a business that buys the right to use another business's brand name, logo and product idea (usually paying a fee and a % of sales).|**Disadvantage 1 – no established brand:** harder to attract customers in a competitive market, so lower sales and higher risk of failure.|**Disadvantage 2 – no training/advertising/support:** Luis must pay for his own advertising and learn the business alone, so higher costs and more mistakes.|(Also: must find own suppliers and ideas.)"}, {"n": 7, "t": "f", "m": 6, "q": "Beena just graduated from university and wants to start a hairdressing business. One option is to buy a franchise from an established well- known hairdressing company for 20,000$. Beena wants to understands that the market so she can provide high quality service. New businesses are entering the market.\nExplain two possible advantages for Beena of buying the franchise (6)", "a": "**Advantage 1 – well-known brand:** attracts customers quickly even with new competitors entering, so higher sales.|**Advantage 2 – training and support:** as a new graduate Beena gets guidance and staff training, so she can provide high-quality service.|(Also: national advertising by the franchisor; proven business model = lower risk.)"}, {"n": 8, "t": "m", "m": 6, "q": "FSW is a multinational company with operations in 6 countries. It manufactures steel for use in the construction industry. Quality assurance* is used to ensure quality production. FSW has many stakeholder groups who are interested in its activities. The Managing Director knows FSW’s business creates external costs*. She is aware that pressure groups* try to influence business decisions.\nExplain one possible benefit and one possible drawback to a country of having FSW (a multinational company) operating there.(6)", "a": "**Benefit:** creates jobs, reducing unemployment and raising incomes and living standards; also tax revenue for government services.|**Drawback:** external costs – steel production causes pollution and damages health/environment; OR profits are sent back to the home country (repatriation); OR local firms may close due to competition."}, {"n": 9, "t": "g", "m": 6, "q": "Paul is the managing director of a private limited company called P-Shirts. It manufactures and sells men’s and women’s shirts in country Y. It has 20 shops and it made sales of 1mn$ last year, however Sales have been fallen recently. Paul is thinking about starting to sell in other countries.\nIdentify and explain two benefits of P-Shirts of selling in other countries (6)", "a": "**Benefit 1 – more customers/higher sales:** sales have fallen at home, so new markets can raise sales and profit.|**Benefit 2 – spreads risk (diversification):** if demand falls in country Y, sales in other countries continue.|(Also: economies of scale, less competition in some markets.)"}, {"n": 10, "t": "m", "m": 8, "q": "Grenada makes meat products such as pies, burgers and ready-made meals. It employs 10 000 workers. It operates in many countries, each with different laws and traditions.. Some middle managers complain that they are not allowed to make important decisions. The directors want to improve communication with employees\nDefine Entrepreneur (2)\nIdentify and explain two disadvantages to Grenada of operating in a number of different countries", "a": "**Entrepreneur:** a person who has a business idea, takes the risk, combines the factors of production and starts a business.|**Disadvantage 1 – cultural/legal differences:** products may not appeal and laws differ, so low sales or legal problems.|**Disadvantage 2 – communication problems:** different languages/long chain of command lead to misunderstandings and errors, higher costs.|(Also: high capital to set up, lack of market knowledge.)"}, {"n": 11, "t": "m", "m": 6, "q": "MHL manufactures tyres for large vehicles. It has factories in 6 countries. The business creates external costs *when producing its products. Good communication with MHL’s suppliers is important. The Managing Director knows globalisation provides many opportunities for MHL. She is reviewing data for one of MHL’s factories as she wants to reduce the average cost of the tyres.\nExplain two opportunities of globalisation for MHL. (6)", "a": "**Opportunity 1 – locate in countries with cheap labour/land:** lowers production costs, so lower average cost per tyre.|**Opportunity 2 – sell abroad easily:** more customers and higher sales.|(Also: get materials from anywhere, free-trade agreements, better transport/communication.)"}, {"n": 12, "t": "g", "m": 6, "q": "VVA is a business based in country X. It manufactures school backpacks (bags). VVA uses retailers* as its channel of distribution*. The Managing Director knows there are many factors that can affect demand, including the stage of the business cycle* and how competitive the market is. VVA imports 45% of its raw materials. The Managing Director is worried that the introduction of import tariffs and import quotas, as well as an appreciation in country X’s exchange rate, will affect VVA.\nExplain one possible effect of each change on VVA when importing: (a) the introduction of import quotas in country X; (b) an appreciation of country X’s exchange rate (6)", "a": "**Import quotas:** limit the quantity of materials VVA can import. With 45% imported, it may not get enough, so output falls, or it must buy dearer local materials, raising costs.|**Appreciation:** the value of country X's currency rises, so imports become cheaper. VVA's raw material costs fall, so it can raise profit or cut prices and increase demand."}, {"n": 13, "t": "g", "m": 10, "q": "RC manufactures fruit smoothies in country X. Many of the ingredients used, including mangoes and strawberries, are imported. TRC will be affected by a depreciation in the exchange rate of country X. TRC is always developing new products. The marketing manager has to decide on suitable packaging for these new products. She also knows it is important that businesses respond\nDefine exchange rate depreciation (2) Identify two reasons why a business might import raw materials. (2)\nExplain two effects of exchange rate depreciation on RC (6)", "a": "**Depreciation:** a fall in the value of a country's currency against other currencies.|**Reasons to import:** cheaper than local; not available locally (e.g. mangoes); higher quality; wider choice.|**Effect 1 – imports dearer:** mango/strawberry costs rise, so costs rise and profit falls or prices must rise, reducing demand.|**Effect 2 – exports cheaper:** if RC exports, foreign customers pay less, so demand and sales rise (or local suppliers become more attractive)."}, {"n": 14, "t": "m", "m": 8, "q": "DGC is a public limited company. It has a reputation for selling high quality clothes and shoes to women. It is a multinational company and owns shops in 10 countries.. DGC is planning to expand into country Z for the first time. DGC has carried our some market research and found that country Z has different cultural and social trends to its existing markets.\nIdentify and explain two advantages to DGC of being multinational business (4)\nIdentify and explain two advantages to DGC of being public limited company(4)", "a": "**MNC advantage 1:** sells in more markets, so higher sales/profit and spread risk.|**MNC advantage 2:** produces where costs are low or avoids import tariffs by making locally.|**PLC advantage 1:** raises large capital by selling shares to the public, to fund expansion into country Z.|**PLC advantage 2:** limited liability / shares easily traded / high status attracts customers."}, {"n": 15, "t": "m", "m": 8, "q": "GF is a multinational company that manufactures packaged food and drinks. It operates factories in 12 countries and is planning to open a new factory in country M. The new factory is expected to employ 800 local workers.. GF is know to have very high quality, but Environmental groups are concerned about the new factory.\nDo you think the advantages of GF to country M of opening there is greater than the disadvantages ? Justify your answer. [8]", "a": "**For (advantages):** 800 jobs reduce unemployment and raise incomes; taxes paid; local suppliers benefit; more choice and high quality; competition lowers prices.|**Against:** pollution/environmental damage (groups concerned); local firms may close; profits sent abroad; large MNC influence hard to regulate.|**Judgement:** advantages are greater IF the factory is well regulated and jobs/taxes are significant; if damage is severe, disadvantages could outweigh. Always justify."}, {"n": 16, "t": "j", "m": 8, "q": "LTX manufactures electric bicycles. It currently sells in country A and is planning to enter country B for the first time. LTX has little knowledge of customers in country B. A local bicycle business has offered to form a joint venture with LTX.\nDo you think LTX should to enter the new market in country B by a Joint venture? Justify your answer. [8]", "a": "**For:** local partner knows customers (LTX has little knowledge); shared capital and risk; shared skills and distribution network; avoids tariffs/quotas.|**Against:** disagreements slow decisions; profits are shared; less control over brand/quality; risk if partner fails.|**Alternatives:** exporting, own factory, franchising.|**Judgement:** yes, because lack of customer knowledge is the main risk – but agree clear terms."}, {"n": 17, "t": "f", "m": 8, "q": "Dania wants to open a café for the first time. She has limited experience of running a business. She is considering either becoming a franchisee of a well-known café or starting the business with her friend Sara, who has experience in managing cafés. The franchise will cost her 10$,000.\nDo you think Dani should start the café as a franchisee or start the business with a partner? Justify your answer. [8]", "a": "**Franchise – for:** established brand, training and support (limited experience), proven method, advertising. **Against:** $10,000 + % of sales, less control/must follow rules, can't adapt to local tastes.|**Partner Sara – for:** experienced manager, shared capital/workload/ideas, no franchise fee. **Against:** unlimited liability, disagreements, profits shared.|**Judgement:** e.g. partnership – Sara's experience matches Dania's weakness and avoids fees; OR franchise if brand matters most. Justify with the case."}], "topics": {"p": "Sole trader & Partnership", "l": "Limited companies", "f": "Franchising", "m": "Multinationals & globalisation", "g": "Trade, tariffs & exchange rates", "j": "Joint ventures"}, "fc": [{"t": "Need", "d": "Something necessary for life (food, water, shelter)", "c": "1"}, {"t": "Want", "d": "Something we desire to improve quality of life", "c": "1"}, {"t": "Land", "d": "Natural resources (forests, oil)", "c": "1"}, {"t": "Labour", "d": "Workers needed to produce", "c": "1"}, {"t": "Capital", "d": "Money invested and man-made resources (machines)", "c": "1"}, {"t": "Enterprise", "d": "Initiative, skills and willingness to take risks to combine factors of production", "c": "1"}, {"t": "Entrepreneur", "d": "Person with a business idea who takes the risk and starts a business", "c": "1"}, {"t": "Scarcity", "d": "Unlimited wants but limited resources", "c": "1"}, {"t": "Opportunity cost", "d": "The next best alternative given up", "c": "1"}, {"t": "Profit", "d": "Total sales minus total costs", "c": "1"}, {"t": "Productivity", "d": "Output per unit of input over a period of time", "c": "1"}, {"t": "Efficiency", "d": "Maximum output using the least resources", "c": "1"}, {"t": "Specialisation", "d": "Each worker does a specific task", "c": "1"}, {"t": "Goods", "d": "Tangible products e.g. cars, laptops", "c": "1"}, {"t": "Services", "d": "Intangible products e.g. banks, schools", "c": "1"}, {"t": "Stakeholder", "d": "Anyone involved in, interested in or affected by a business", "c": "2"}, {"t": "Internal stakeholder", "d": "Owners, managers/directors, employees", "c": "2"}, {"t": "External stakeholder", "d": "Customers, suppliers, banks, government, community", "c": "2"}, {"t": "Sole trader", "d": "Business owned and controlled by one person", "c": "3"}, {"t": "Partnership", "d": "Owned by 2+ people who share capital, profit and responsibility", "c": "3"}, {"t": "Unlimited liability", "d": "Owners may have to use personal wealth to pay business debts", "c": "3"}, {"t": "Unincorporated business", "d": "No separate legal identity from owners (sole trader, partnership)", "c": "3"}, {"t": "Limited liability", "d": "Owners only lose the amount they invested", "c": "4"}, {"t": "Incorporated business", "d": "Has a separate legal identity from its owners", "c": "4"}, {"t": "Share", "d": "A unit of ownership in a company", "c": "4"}, {"t": "Dividend", "d": "Payment to shareholders from profit after tax", "c": "4"}, {"t": "Private limited company (Ltd)", "d": "Shares sold privately only, e.g. to family and friends", "c": "4"}, {"t": "Public limited company (plc)", "d": "Shares sold to the public on the stock exchange", "c": "4"}, {"t": "Retained profit", "d": "Profit reinvested back into the business", "c": "4"}, {"t": "Joint venture", "d": "Two or more businesses agree to work on a specific project together", "c": "5"}, {"t": "Franchise", "d": "Agreement to use another business's brand name, logo and product idea", "c": "6"}, {"t": "Franchisor", "d": "Business that sells the right to use its brand", "c": "6"}, {"t": "Franchisee", "d": "Business that buys the right to use the brand", "c": "6"}, {"t": "Social enterprise", "d": "Business with social and environmental aims plus profit to reinvest", "c": "6"}, {"t": "Triple bottom line", "d": "Financial, social and environmental aims", "c": "6"}, {"t": "Globalisation", "d": "Increase in world trade and movement of products and people", "c": "7"}, {"t": "Multinational", "d": "Has investments (branches, factories) in two or more countries", "c": "7"}, {"t": "International business", "d": "Sells and trades products with other countries", "c": "7"}, {"t": "Import tariff", "d": "A tax on imported products", "c": "7"}, {"t": "Import quota", "d": "A limit on the number of products imported", "c": "7"}, {"t": "Protectionism", "d": "Protecting local businesses from foreign competition", "c": "7"}, {"t": "Localising brands", "d": "Adapting products and advertising to local culture", "c": "7"}, {"t": "Repatriation of profits", "d": "Sending profits back to the home country", "c": "7"}, {"t": "Private sector", "d": "Businesses owned by individuals/companies, aiming for profit", "c": "8"}, {"t": "Public sector", "d": "Businesses owned and controlled by the government", "c": "8"}, {"t": "Exchange rate", "d": "Value of one currency in terms of another", "c": "8"}, {"t": "Depreciation", "d": "Fall in a currency's value: imports dearer, exports cheaper", "c": "8"}, {"t": "Appreciation", "d": "Rise in a currency's value: imports cheaper, exports dearer", "c": "8"}, {"t": "Primary sector", "d": "Extracts natural resources (farming, mining)", "c": "9"}, {"t": "Secondary sector", "d": "Manufactures goods from raw materials", "c": "9"}, {"t": "Tertiary sector", "d": "Provides services (banks, shops)", "c": "9"}], "ch": {"1": "Business activity & entrepreneurship", "2": "Stakeholders", "3": "Sole trader & partnership", "4": "Limited companies", "5": "Joint ventures", "6": "Franchising & social enterprise", "7": "Multinationals", "8": "Public sector & exchange rates", "9": "Stages of production"}, "notes": {"1": "Needs = survival, wants = quality of life.|Factors of production: land, labour, capital, enterprise.|Entrepreneur qualities: innovative, problem-solving, risk-taker, communicator, confident.|Advantages: satisfaction, high reward, flexible, use own skills. Challenges: raising capital, failure risk, competition, opportunity cost.|Profit = sales − costs; Sales = price × quantity.|High productivity → high efficiency → less cost → more profit.|Specialisation: experts and easy training, but boredom and hard to cover absences.", "2": "Internal: owners, managers, employees. External: customers, suppliers, banks, government, community.|Owners want profit; customers want quality/price; employees want wages/conditions; banks want repayment + interest; government wants jobs and taxes; community wants jobs and no pollution.|Conflicts: owners vs employees (wages), owners vs community (pollution), owners vs customers (prices), directors vs shareholders.", "3": "Sole trader – Pros: full control, keep all profit, close to customers, easy start. Cons: limited capital/ideas, unlimited liability, no continuity.|Partnership – Pros: shared capital, skills and workload, shared risk. Cons: disagreements, shared profit, unlimited liability, no continuity.|Both are unincorporated.", "4": "Limited liability + separate legal identity = incorporated.|Ltd: shares sold privately; keep control, raise some capital; but cannot raise huge sums, many regulations.|Plc: shares on stock exchange; raise large capital, easy to trade; but loss of control, takeover risk (50%+), costly to float.|Board of directors, AGM, dividends, retained profit.", "5": "Joint venture = 2+ businesses on a specific project.|Pros: shared capital/risk, shared knowledge, more awareness.|Cons: disagreements, shared profits, one failing affects all.", "6": "Franchisor sells the right; franchisee buys it.|Franchisee pros: known brand, training, advertising. Cons: fees + % profit, less control, can't adapt.|Franchisor pros: fast expansion, less risk. Cons: reputation depends on franchisee.|Social enterprise: triple bottom line.", "7": "Globalisation opportunities: sell abroad, cheap land/labour, get workers/materials anywhere.|Causes: transport, communication, free-trade agreements, newly industrialised countries.|MNC pros: new markets, spread risk, low costs, avoid tariffs. Cons: high capital, cultural differences, language, lack of knowledge.|Host country pros: jobs, taxes, choice, competition. Cons: local firms close, repatriation, pollution, strong influence.|Tariffs/quotas protect local firms but raise import prices.", "8": "Public sector: affordable essentials, jobs, all areas. Cons: no profit motive → waste, political use.|Depreciation: imports dearer, exports cheaper, more demand for local goods.|Appreciation: imports cheaper, exports dearer, less demand for local goods.", "9": "Primary → secondary → tertiary.|Sector size is measured by workers employed or value of output."}};

<button class="tile" onclick="go('quiz')"><b>⚡ Quiz</b><span>Multiple choice by chapter</span></button><button class="tile" onclick="go('exam')"><b>⏱ Exams</b><span>Timed, real past questions</span></button>
<button class="tile" onclick="go('topics')"><b>🎯 By topic</b><span>${D.q.length} past-paper questions</span></button></div>
<p class="mut">Tip for the exam: answer “identify and explain” as Point → Because → So (apply to the business in the case). For 8-mark questions: both sides, then a justified judgement.</p>`};
V.notes=()=>{app.innerHTML='<h2>Notes</h2>'+Object.entries(D.ch).map(([k,v])=>`<details><summary>Ch ${k} · ${v}</summary><ul>${D.notes[k].split('|').map(x=>'<li>'+x+'</li>').join('')}</ul></details>`).join('')};
let C={ch:'all',i:0,back:false,deck:[]};
V.cards=()=>{C.deck=D.fc.filter(f=>C.ch=='all'||f.c==C.ch);if(C.i>=C.deck.length)C.i=0;const f=C.deck[C.i];
app.innerHTML=`<h2>Flashcards</h2>${chipsH(C.ch,'cch',chOpts)}<div class="mut">${C.i+1}/${C.deck.length} · mastered ${C.deck.filter(x=>S.known[x.t]).length}</div>
<div class="flash ${C.back?'back':''}" onclick="C.back=!C.back;V.cards()">${C.back?f.d:f.t}</div><p class="mut" style="text-align:center">Tap card to flip</p>
<button class="btn bad" onclick="cg(0)">Again</button><button class="btn ok" onclick="cg(1)">Got it</button><button class="btn alt" onclick="C.deck=null;D.fc=shuf(D.fc);C.i=0;V.cards()">Shuffle</button>`};
const cch=k=>{C.ch=k;C.i=0;C.back=false;V.cards()};
const cg=g=>{const f=C.deck[C.i];if(g)S.known[f.t]=1;else delete S.known[f.t];save();C.i=(C.i+1)%C.deck.length;C.back=false;V.cards()};
let Z={ch:'all',qs:[],i:0,sc:0,a:false};
V.quiz=()=>{if(!Z.qs.length){app.innerHTML=`<h2>Quiz</h2>${chipsH(Z.ch,'zch',chOpts)}<button class="btn" onclick="zs()">Start 10 questions</button>`;return}
if(Z.i>=Z.qs.length){app.innerHTML=`<h2>Score: ${Z.sc}/${Z.qs.length}</h2><div class="card">${Z.sc>=8?'🔥 Excellent!':Z.sc>=5?'👍 Good – review the ones you missed.':'Keep going – use flashcards first.'}</div><button class="btn" onclick="Z.qs=[];V.quiz()">Again</button>`;return}
const q=Z.qs[Z.i];app.innerHTML=`<div class="mut">Question ${Z.i+1}/${Z.qs.length}</div><div class="card"><h3>Which definition matches “${q.f.t}”?</h3>${q.o.map((o,j)=>`<button class="opt" onclick="za(${j})">${o}</button>`).join('')}</div>`};
const zch=k=>{Z.ch=k;Z.qs=[];V.quiz()};
const zs=()=>{const pool=D.fc.filter(f=>Z.ch=='all'||f.c==Z.ch),all=D.fc;Z.qs=shuf(pool).slice(0,10).map(f=>{const d=shuf(all.filter(x=>x.t!=f.t)).slice(0,3).map(x=>x.d);return{f,o:shuf([f.d].concat(d))}});Z.i=0;Z.sc=0;Z.a=false;V.quiz()};
const za=j=>{if(Z.a)return;Z.a=true;const q=Z.qs[Z.i],bs=document.querySelectorAll('.opt');bs.forEach((b,x)=>{if(q.o[x]==q.f.d)b.classList.add('ok');else if(x==j)b.classList.add('bad')});if(q.o[j]==q.f.d)Z.sc++;
setTimeout(()=>{Z.i++;Z.a=false;V.quiz()},1100)};
let E={on:false,qs:[],i:0,t:0,mk:[],sh:false};
V.exam=()=>{if(!E.on){app.innerHTML=`<h2>Exams</h2><div class="card"><h3>Mini exam</h3><div class="mut">5 random past questions · timed at 1 minute per mark</div><button class="btn" onclick="es(5)">Start</button></div><div class="card"><h3>Full Unit 1 paper</h3><div class="mut">All ${D.q.length} questions · timed by marks (1 min per mark)</div><button class="btn" onclick="es(99)">Start</button></div><p class="mut">Best scores: mini ${S.best[5]||'–'}% · full ${S.best[99]||'–'}%</p>`;return}
if(E.i>=E.qs.length){const g=E.mk.reduce((a,b)=>a+b,0),m=E.qs.reduce((a,q)=>a+q.m,0),p=Math.round(g/m*100);S.best[E.k]=Math.max(S.best[E.k]||0,p);save();E.on=false;clearInterval(E.iv);app.innerHTML=`<h2>Result: ${g}/${m} (${p}%)</h2><div class="card">${p>=70?'🔥 Strong paper.':p>=50?'Solid – revisit the topics you lost marks on.':'Review the notes then retry.'}</div><button class="btn" onclick="V.exam()">Back</button>`;return}
const q=E.qs[E.i];app.innerHTML=`<div class="mut">Q${E.i+1}/${E.qs.length} · ${q.m} marks · <b id="tm"></b></div><div class="card q">${q.q}</div><textarea id="ta" placeholder="Write your answer here…" oninput="E.tx=this.value">${E.tx||''}</textarea>
${E.sh?`<div class="ans">${q.a.split('|').map(x=>'<p>'+md(x)+'</p>').join('')}</div><p>Marks you earned (0–${q.m}): <input id="mk" type="number" min="0" max="${q.m}" value="0" style="width:64px;padding:6px"></p><button class="btn ok" onclick="en()">Next</button>`:`<button class="btn" onclick="E.sh=true;V.exam()">Show model answer</button>`}`;tick()};
const es=n=>{E.k=n;E.qs=n==99?D.q.slice():shuf(D.q).slice(0,n);E.i=0;E.mk=[];E.sh=false;E.tx='';E.on=true;E.t=E.qs.reduce((a,q)=>a+q.m,0)*60;clearInterval(E.iv);E.iv=setInterval(()=>{E.t--;tick()},1000);V.exam()};
const tick=()=>{const e=$('#tm');if(e)e.textContent='⏱ '+Math.floor(E.t/60)+':'+String(Math.max(0,E.t%60)).padStart(2,'0')};
const en=()=>{E.mk.push(Math.min(E.qs[E.i].m,Math.max(0,+$('#mk').value||0)));E.i++;E.sh=false;E.tx='';V.exam()};
let P={t:'all'};
V.topics=()=>{const list=D.q.filter(q=>P.t=='all'||q.t==P.t);app.innerHTML=`<h2>Questions by topic</h2>${chipsH(P.t,'pt',[['all','All']].concat(Object.entries(D.topics)))}`+list.map(q=>`<div class="card"><span class="mut">${D.topics[q.t]} · ${q.m} marks · Q${q.n}</span><div class="q" style="margin-top:6px">${q.q}</div><details><summary>Model answer</summary><div class="ans">${q.a.split('|').map(x=>'<p>'+md(x)+'</p>').join('')}</div></details></div>`).join('')};
const pt=k=>{P.t=k;V.topics()};
go('home');
</script></body></html>
